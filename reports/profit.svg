    .gap-down { fill: #cf222e; fill-opacity: 0.13; }
    .rate-up { fill: #1a7f37; fill-opacity: 0.13; }
    .rate-down { fill: #cf222e; fill-opacity: 0.13; }
    .up { fill: #1a7f37; }
    .down { fill: #cf222e; }
    .dot-value { fill: #d97706; }
    .dot-basis { fill: #8c959f; }
    .dot-rate { fill: #0969da; }
