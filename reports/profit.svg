      .value { stroke: #f0b429; }
      .rate { stroke: #58a6ff; }
      .gap-up, .rate-up { fill: #3fb950; fill-opacity: 0.16; }
      .gap-down, .rate-down { fill: #f85149; fill-opacity: 0.16; }
      .up { fill: #3fb950; }
      .down { fill: #f85149; }
      .dot-value { fill: #f0b429; }
