      .fg-muted { fill: #8b949e; }
      .grid { stroke: #30363d; }
      .zero { stroke: #6e7681; }
      .basis { stroke: #6e7681; }
      .value { stroke: #f0b429; }
      .rate { stroke: #58a6ff; }
      .gap-up, .rate-up { fill: #3fb950; fill-opacity: 0.16; }
      .gap-down, .rate-down { fill: #f85149; fill-opacity: 0.16; }
      .up { fill: #3fb950; }
      .down { fill: #f85149; }
      .dot-value { fill: #f0b429; }
      .dot-basis { fill: #6e7681; }
      .dot-rate { fill: #58a6ff; }
    }
