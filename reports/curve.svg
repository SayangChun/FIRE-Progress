<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" role="img" aria-label="进度曲线：出发门槛、咖啡师 FIRE 与完全 FIRE">
  <title>进度曲线：出发门槛、咖啡师 FIRE、完全 FIRE</title>
  <desc>从 2026-09-24 到 2026-11-05，咖啡师 FIRE 完成度 9.85%，出发门槛 36.09%，完全 FIRE 4.97%。竖虚线处为 FIRE 目标变化（分母变了），不是资产变动。 出发门槛自 2026-10-31 起逐日记录，之前按当前门槛折算，因此那一段是平滑线——它不是历史记录，是反事实。 完全 FIRE 门槛自 2026-11-05 起逐日记录，之前按当前门槛折算（反事实）。 2026-10-27 起分子纳入纳指100（当日跳升约 2.1 个点属口径变化，非资产增长）。</desc>
