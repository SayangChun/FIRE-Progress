<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" role="img" aria-label="进度曲线：出发门槛、咖啡师 FIRE 与完全 FIRE">
  <title>进度曲线：出发门槛、咖啡师 FIRE、完全 FIRE</title>
  <desc>从 2026-09-24 到 2026-11-18，咖啡师 FIRE 完成度 13.86%，出发门槛 46.31%，完全 FIRE 6.55%。竖虚线处为 FIRE 目标变化（分母变了），不是资产变动。 出发门槛自 2026-10-31 起逐日记录，之前按当前门槛折算，因此那一段是平滑线——它不是历史记录，是反事实。 完全 FIRE 门槛自 2026-11-05 起逐日记录，之前按当前门槛折算（反事实）。 竖虚线只标注分母（FIRE 目标）变化；分子范围变化（纳指100 已纳入、稳定币与人民币活钱已纳入分子）不单独标注，读图时请注意。稳定币按实时 USD/CNY 折算，汇率变动也会让曲线变动。</desc>
