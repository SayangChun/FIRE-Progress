<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" role="img" aria-label="进度曲线：出发门槛与不工作门槛">
  <title>进度曲线：出发门槛与不工作门槛</title>
  <desc>从 2026-09-24 到 2026-11-05，不工作门槛完成度 9.94%，出发门槛 29.49%。竖虚线处为 FIRE 目标变化（分母变了），不是资产变动。 出发门槛自 2026-10-31 起逐日记录，之前按当前门槛折算，因此那一段是平滑线——它不是历史记录，是反事实。 2026-10-27 起分子纳入纳指100（当日跳升约 2.1 个点属口径变化，非资产增长）。</desc>
