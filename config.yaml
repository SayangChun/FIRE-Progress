#
# ⚠️ 这些数字是**假设**，不是预测，也不是承诺。取值原则：
#    既不取历史最好成绩，也不取最坏情形，取「讲得出理由的中枢」。
#
#   标普500 6%（扣费后、人民币口径）
#     长期名义回报约 10%，但当前 CAPE 38–41 处于历史 95%+ 分位；
#     历史同类估值起点的十年回报中枢明显更低（有研究给到实际负回报）。
#     扣掉 QDII 基金约 0.6%–0.8% 的费率后取 6%。区间 3%–9%。
#     汇率按 0% 漂移处理——升值与贬值理由互相抵消，不做方向性下注。
#
#   稳定币 10%（限额活动）
#     交易所限额内活期理财的活动年化，不是无风险利率，也不是长期收益：
#     限额会变、活动会结束、平台信用与脱锚风险都在。
#     区间 0%（活动结束，只剩活期）~ 10%（限额内拿满）。
#     ⚠️ 计入分子后它会**参与加权年化和外推**，所以区间下沿必须按 0% 记，
#        否则看板会把它当成一个稳定可得的 10%。
#
#   人民币活钱 1%（保守）
#     余额宝一类货币基金，按 1% 保守取值。区间 1%–1.5%，
#     不设更高的乐观值——它的作用是可随时动用，不是贡献收益。
#
# 区间不是摆设：把它们代进去，加权年化会摆得很宽。
# 这个宽度说明「每小时被动收入」是个量级参考，不是一个可以拿去做预算的数。
expected_return:
  sp500: 0.06
  sp500_low: 0.03
  sp500_high: 0.09
  # 纳指100：**暂按标普500 同口径**。
  # 两者都是美股宽基、相关性 0.9 以上，用同一组假设可以避免引入新的主观判断。
  # 历史上纳指回报略高、波动也更大，但那是「历史」，不是他的判断——等他给数再改。
  ndx100: 0.06
  ndx100_low: 0.03
  ndx100_high: 0.09
  stablecoin: 0.10
  stablecoin_low: 0.00
  stablecoin_high: 0.10
  cash_cny: 0.01
  cash_cny_low: 0.01
  cash_cny_high: 0.015

# ------------------------------------------------------------
# 隐私
#   full   = 显示精确金额
#   masked = 只显示百分比与进度条，金额以数量级模糊展示
# 注意：本仓库为公开仓库，full 模式会公开你的精确持仓金额。
# ------------------------------------------------------------
privacy:
  mode: full

# ------------------------------------------------------------
# 展示
# ------------------------------------------------------------
# 定投额（只统计投进资产池的钱）
#
# 「外推」用它算：日定投 + 已有持仓的复利增长，一起推「还要多久」。
# 不用历史增速，因为历史增速由行情主导——涨得快不等于进度快，
# 跌的时候按历史增速外推还会得出「永远达不到」的荒谬结论。
# 定投额是自己能控制的，这才是外推该用的输入。
#
# ⚠️ 每月储蓄是 ¥2,000（timeline.monthly_contribution），比这里多约 ¥1,400/月：
#    那部分留在人民币活钱里、同样计入分子，但没有进外推，
#    所以 README 的达成年限偏保守。见 docs/FIRE-ROADMAP.md §2.2。
contribution:
  sp500_cny_per_day: 20 # 标普500：每天 ¥20（与 sp500-dca 仓库展示一致）
  ndx100_cny_per_day: 0 # 纳指100：已停止定投，份额固定

# ------------------------------------------------------------
display:
  show_projection: true # 按「定投 + 资产增值」外推（非预测，可关闭）
  # 自绘 SVG 进度条（reports/progress.svg）。
  # 不用 shields.io 徽章：那是不可控的外部服务，大陆网络时通时不通，
  # 且 label 含中文时未 URL 编码会直接返回 404；文本进度条则受字体宽度影响。
  show_progress_bar: true
  show_curve: true
  # 收益曲线（reports/profit.svg）：累计投入 vs 当前市值，缺口即累计盈亏。
  # 数据来自 history.json 里的 basis_cny / profit_cny —— 必须逐日留档，
  # 事后无法精确重建（逐日快照无法回溯），所以当天不记就永久丢失。
  show_profit_curve: true
  show_life_plan: true # 在 README 里展示月开销明细（FIRE 生活预算）
  # 主进度用哪个门槛（先用出发门槛）。
  # 可选值：
  #   departure   = 出发门槛下沿（能不能动身）
  #   coffee_fire = 咖啡师 FIRE 门槛（有兼职，¥180,837.21）
  #   full_fire   = 完全 FIRE 门槛（完全不工作，¥382,604.65）
  # ⚠️ 只决定「主进度」这个展示位取哪个门槛，以及三者的排列顺序；
  #    三个门槛本身的金额、完成度、历史留档一律照常计算，不随它变。
  #    以后要换主进度，改这一行即可，不用动代码。
  primary_progress: departure
  # 分子口径变化的人工说明。
  # 曲线图的竖虚线只标注「分母（FIRE 目标）变化」，**分子（资产构成）变化不会自动标注**——
  # 那会在曲线上留下一个无标记的跳升，看起来像一天赚了钱。
  # 把说明写在这里，会附在曲线图的描述里。
  # ⚠️ 稳定币纳入分子后，汇率每天都会让折算值变动，曲线会随汇率小幅起伏，不是行情。
  capital_change_note: "竖虚线只标注分母（FIRE 目标）变化；分子范围变化（纳指100 已纳入、稳定币与人民币活钱已纳入分子）不单独标注，读图时请注意。稳定币按实时 USD/CNY 折算，汇率变动也会让曲线变动。"
  # 每小时被动收入：当前持仓 × 预期年化回报 ÷ 8760。
  # 这是**假设性测算**，口径见上面的 expected_return 段。
  show_passive_income: true

# ------------------------------------------------------------
# 自动化
# ------------------------------------------------------------
automation:
  timezone: "Asia/Shanghai"
  # 提交门控：变动不够大就不提交，避免刷屏。
  #
  # 阈值取「绝对下限」与「总资产 × 比例」中的较大者：
  # 用比例而非固定金额，是因为固定金额不随资产规模变化——
  # 资产小的时候 1 元就是 0.007%（几乎每小时都触发），
  # 资产大了之后同样的金额又变得毫无意义。
  min_commit_delta_ratio: 0.003 # 总资产变动达到 0.3% 才提交
  min_commit_delta_cny: 1.0 # 绝对下限，防止资产很小时被分币级波动触发
  # 另外：跨天必定提交一次，保证进度曲线每天至少有一个数据点。
