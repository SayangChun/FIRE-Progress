# ============================================================
# FIRE-Progress 配置文件
# 所有可调参数集中在此，代码不硬编码任何口径。
# ============================================================

fire:
  # 月开销（元）。
  #   null = 由下面的 life_plan 逐项推导（推荐，每一分钱都能追溯到依据）
  #   数字 = 覆盖 life_plan 的结果，用于临时试算「如果每月只花 X 会怎样」
  monthly_expense: null
  withdrawal_rate: 0.043 # 提取率 4.3%
  currency: CNY
  currency_symbol: "¥"

  # ----------------------------------------------------------
  # 两个「不工作」门槛（并列展示）
  # ----------------------------------------------------------
  # 两条门槛并列，谁都不许含糊：
  # 咖啡师 FIRE 假设 FIRE 之后仍在做兼职，完全 FIRE 不依赖任何劳动收入。
  #
  #   咖啡师 FIRE 门槛 = (月开销 − 兼职净收入) × 12 ÷ 提取率 = ¥180,837.21
  #     → 有兼职，资产只需覆盖 ¥648/月
  #   完全 FIRE 门槛   =  月开销          × 12 ÷ 提取率 = ¥382,604.65
  #     → 完全不工作，资产要覆盖全额 ¥1,371/月
  #
  # 两者共用同一套 life_plan 月开销，只是扣不扣兼职收入的区别。
  # 完全 FIRE 门槛不需要单独配置，代码从 monthly_expense 直接算，
  # 避免出现两处金额不一致。

  # ----------------------------------------------------------
  # 兼职收入（咖啡师 FIRE 门槛用）
  # ----------------------------------------------------------
  # 走的是**咖啡师 FIRE**，不是传统 FIRE。
  # FIRE 之后仍会做「低压力、可随时停、不需要 career」的兼职，
  # 这份收入用来覆盖一部分生活开销，所以不需要靠资产覆盖全部开销。
  #
  # ⚠️ 只扣「因为工作才产生」的增量消耗，不扣本来就要花的钱。
  #    比如在外吃饭只算比在家吃贵出来的那部分——家里那顿的成本
  #    已经在 life_plan 的「食品」里了，全额扣等于重复计算。
  #
  # ⚠️ 这份收入现在**只用于咖啡师 FIRE 门槛**（以及阶段 A 的两段式推演），
  #    不再定义唯一的「不工作门槛」——完全 FIRE 门槛不扣它。
  #
  # ⚠️ enabled: false 时咖啡师 FIRE 门槛退回全额月开销，
  #    与完全 FIRE 门槛相等。留着是为了随时对比「有兼职能少攒多少」。
  #
  # ⚠️ 净收入 ≥ 月开销会直接报错。那意味着「不用攒钱就能 FIRE」，
  #    实务上几乎一定是配置写错了，静默算出目标 0 比报错危险得多。
  labor_income:
    enabled: true
    label: 咖啡师 FIRE · 兼职

    # 时薪：**¥15**，刻意取低，让目标偏保守。
    # 市场参考：职友集牡丹江咖啡师全职 ¥3–6K/月，折 ¥17–35/小时——¥15 是往下压，不是往上估。
    # ¥15 是刻意往下压的保守值，不是市场价，也不是法定下限。
    hourly_wage: 15

    # 每周 3 天 × 每天 4 小时 = 12 小时/周。月工时按 52 周 ÷ 12 折算，不按 4 周（会少算 8%）。
    # ⚠️ 他说明「兼职时间也是不确定的」——3 天只是当前假设。
    #    工时是乘数：每增减一天（4h），FIRE 目标差约 ¥70,140。敏感性见规划书 §7.4。
    hours_per_week: 12
    work_days_per_week: 3

    # 交通：牡丹江公交 ¥1/人次（一票制），往返 ¥2。冬季 −25℃ 骑不了车，
    # 所以全年按公交建模，不美化成「骑车零成本」，保留保守余量。
    transport_per_day: 2.0

    # 往返通勤时间（小时）。不产生现金支出，但**要算进等效时薪**——
    # 4 小时班 + 1 小时通勤 = 实际占用 5 小时，等效时薪比名义时薪低 20%。
    # 这个数只用于展示，不参与 FIRE 目标计算。
    commute_hours_per_day: 1.0

    # 餐食增量：半天班偶尔跨饭点，每月约 3–4 次在外解决。
    # 只算比在家做饭贵出来的差额（约 ¥7/顿），不是一顿饭的全价。
    meal_increment_monthly: 25.0

    # 装备摊销：工服由店方提供，个人只需防滑鞋。¥150 ÷ 2 年。
    gear_monthly: 6.0

    note: "工作不只是为了赚钱，也是为了体验生活和融入社会。咖啡师在这里是隐喻：低压力、可随时停、不需要 career 的兼职。"

  # ----------------------------------------------------------
  # 全职情景
  # ----------------------------------------------------------
  # ⚠️ 这一段**不参与 FIRE 目标计算**，只做现金流展示与决策参考。
  #
  # 原因：全职净收入必然超过月开销（¥1,371），代进
  #     (月开销 − 净收入) × 12 ÷ 提取率
  # 会得到负数。负数不是「超额完成」，而是「这个公式在这里没有答案」——
  # 它回答的是「资产要多大才能替代工资」，而全职本身就有工资。
  # 所以 `_net_after_labor` 仍然只读 labor_income（兼职兜底），
  # 全职的现金流单独算、单独展示，绝不进入 target_cny。
  #
  # 阶段 A 的主线：**牡丹江 + 独自租房 + 轻松工作**。
  # 明确排除北京：城市太吵，且包吃住岗意味着 4–6 人间宿舍、
  # 与别人一起生活——他要的是「一个人租房子、安静地过」。
  # **不接受包吃住**（包吃住＝住宿舍＝和别人一起生活），
  # 月开销按完整口径 ¥1,371 计，而不是包吃住后的口径。
  #
  # ⚠️ 工作形态**不局限于图书馆保安**，
  #    而是「任何一个适合自己的轻松工作」。图书馆只是一个例子，不是首选、
  #    不是硬条件、也不是门槛。判据是工作性质，不是岗位名字：
  #      低内耗 / 坐岗 / 不轮岗 / 低人际 / 责任边界清楚 / 可随时停
  #    外加居住硬条件「独自租房」。详见路线图 §3.5.9.5。
  #    失业还有约 ¥9.4 万资产做缓冲。
  #
  # **FIRE 目标仍按兼职兜底口径（¥180,837.21）计算**，不改。
  fulltime:
    enabled: true
    label: 全职 · 轻松工作（牡丹江，独自租房）
    # 这个岗位在哪个城市——决定「阶段 A 个人开销」用哪套 life_plan 明细。
    # 显式写牡丹江档，换激活 profile 时盈余不会跳。
    life_plan_profile: mudanjiang-rent-minimal
    # ⚠️ 工资是**占位假设**，不是某个岗位的实报价：取 ¥17/h≈¥2,739。
    #    参考牡丹江本地集团保安/保洁类岗位月薪上限 ¥5,000 且周末双休、
    #    牡丹江咖啡公司服务员 ¥2–4.5K/月（职友集，2026-10）。工作形态泛化后，
    #    它代表「任何符合条件的轻松岗」的保守估算，不绑定具体工种。
    #    换岗位时按实际工资改这里，其余自动重算。
    hourly_wage: 17
    hours_per_week: 40
    work_days_per_week: 5
    # 独自租房 → 自己通勤、自己吃饭：公交 ¥2/天、餐食增量 ¥154/月。
    transport_per_day: 2.0
    commute_hours_per_day: 1.0
    meal_increment_monthly: 154.0
    # 全职着装与鞋耗比兼职快
    gear_monthly: 10.0
    # ----------------------------------------------------------
    # 不包吃住：他要一个人租房住，不接受宿舍/合住。
    # 所以阶段 A 个人开销 = 完整月开销 ¥1,371（含房租（含取暖与物业）/食品/饮用水），
    # 不再用 monthly_excluding() 扣覆盖项。
    # ⚠️ 这一项只影响「阶段 A 盈余」的分母，**绝不改变 FIRE 目标 ¥180,837.21**。
    room_and_board_covered: false
    note: "阶段 A 的工作判据：任何一个适合自己的轻松工作（低内耗、坐岗、不轮岗、低人际、责任边界清楚、可随时停），不局限于图书馆保安。独自租房、安静生活、不包吃住。⚠️ 工资 ¥17/h 是保守占位假设，换岗位按实际改。找不到符合条件的全职才退回兼职兜底；找不到图书馆岗不等于计划失败。"

# ------------------------------------------------------------
# FIRE 生活规划（Life Plan）
# ------------------------------------------------------------
# 目的：把「月开销」从拍脑袋的数字，换成一份可追溯的逐项预算。
#
#       FIRE 目标 = 月开销 × 12 ÷ 提取率
#
# 所以这里每一项金额都会直接改变 FIRE 目标、进而改变完成度。
# 改一项，全盘重算——这正是把它写进 config 而不是写进文档的原因。
#
# 口径：
#   1. 只统计「FIRE 之后」的经常性支出，不是当前的生活成本。
#   2. 一次性支出（搬家等）不进月开销。它们不产生永续
#      现金流，混进「月开销 × 12 ÷ 提取率」会同时虚增月开销与目标，
#      所以单列在 one_off，另外加总。
#   3. 逐项都标注依据；凡估算值一律写明「估算」。
#
# 切换方案：改 life_plan.profile 一行即可，其余自动重算。
# 若 profile 写了不存在的名字，程序会直接报错，不会静默回落——
# 静默回落会让 FIRE 目标悄悄跑偏，比报错危险得多。
# ------------------------------------------------------------
# 两段式时间线
# ------------------------------------------------------------
# 这一段**不参与 FIRE 目标计算**，只记录「什么时候出发、能撑多久」。
# 完整推演见 docs/FIRE-ROADMAP.md。
#
# 为什么要单独记：FIRE 目标 ¥180,837.21 是「永续」口径的数字，
# 而实际计划是两段式的——阶段 A（牡丹江独立期）有明确的退出条件
# （长辈病情加重 → 回北京，此后不再回来），因此**不需要永续**。
# 两者回答的是不同问题：
#   目标公式      → 「还要攒多少」（进度条用）
#   这一段        → 「这笔钱够撑多久」（决策用）
#
# ⚠️ 改这里不会改变 README 上的 FIRE 目标与完成度。
timeline:
  # 毕业时间。既是积累期的终点，也是阶段 A 的起点。
  graduation: "2029-06"
  start_age: 22

  # 每月储蓄 ¥2,000 = 标普500 定投约 ¥600（¥20/天 × 30，从人民币活钱扣）
  #    + 留在活钱约 ¥1,400/月。两项都在分子内。
  # ⚠️ 外推只按 contribution 里的 ¥600/月 算新增资金，另外 ¥1,400/月
  #    虽在分子里却没进外推，达成年限因此偏保守；见路线图 §2.2。
  # 改 contribution 段的定投额时，这里按「储蓄能力不变」保持 ¥2,000，
  # 差额自动落到活钱；只有储蓄能力本身变了才改这个数。
  # 32 个月 × ¥2,000，配合起点资产与收益，毕业时可动用的钱见路线图 §2.2。
  # ⚠️ 在 32 个月这个尺度上，收益率仍然不重要，效率来自储蓄率。
  monthly_contribution: 2000

  # 阶段 A 的退出条件。所以它的长度**不由自己决定**，由长辈健康决定。
  # 敏感性见 docs/FIRE-ROADMAP.md §3.2：外公约 95 岁需要 18 年，
  # 而 3 天方案的兜底续航约 10.7 年，覆盖不到 18 年。
  # 阶段 A 有全职盈余时本金不被消耗，这段只描述最坏情形的兜底链。
  phase_a_exit: "长辈病情加重，需回京看护"

# ------------------------------------------------------------
# 出发门槛
# ------------------------------------------------------------
# 全职方案下，FIRE 目标不再是出发条件——有工作就有现金流。
# 真正决定「能不能走」的是：到了牡丹江撑得住，且不会因病返贫。
#
#     出发门槛 = 医疗专项应急金 + 空窗期月开销
#
# ⚠️ 医疗应急金（规划书 §5.4）一直是**独立于 FIRE 目标**的一笔钱，
#    它已写进配置——在两段式方案下，
#    它才是真正的出发约束，比 ¥180,837.21 更早成为瓶颈。
#
# ⚠️ 出发门槛**不含任何一次性支出**（搬家/押金等）。2026-11-07 起
#    include_one_off 设为 false：用户明确「出发门槛中不要设置搬家成本」。
#    出发门槛只答「能不能走」= 医疗应急 + 空窗期月开销，是纯生存跑道；
#    一次性支出（押金等）单列在 one_off，只进 FIRE 落地目标的
#    target_with_one_off，不进出发门槛。
#
# ⚠️ 下沿与上沿的分工：
#    下沿 = 出发前必须到位的钱（医疗 ¥5 万 + 空窗 3 个月）
#    上沿 = 加上「更保守的医疗额度 + 更长空窗」之后的需求
#    中间差额可以边工作边补——全职有现金流，这是新方案比旧方案多出来的路。
departure:
  enabled: true
  # 出发门槛是否把 life_plan.one_off（押金等一次性支出）算进去。
  # 2026-11-07 起设为 false：用户明确「出发门槛中不要设置搬家成本」。
  # 出发门槛只答「能不能走」= 医疗应急 + 空窗期月开销，不含任何一次性支出。
  include_one_off: false
  # 零医保、住院 100% 自付，取规划书 §5.4 的区间（不因取消医保而下调）
  medical_reserve_low: 50000
  medical_reserve_high: 100000
  # 到落脚城市后到第一笔工资之间，按几个月的月开销准备
  gap_months_low: 3
  gap_months_high: 6
  note: "双线进度条的第一条。它回答「能不能走」，¥180,837.21 回答「能不能不工作」。"

# ------------------------------------------------------------
# 资产配置（仅用于展示失衡程度）
# ------------------------------------------------------------
# ⚠️ **加资产不能让目标变化**——分子由标普500、纳指100、稳定币与人民币活钱构成。
#    这一段只读取实时市值算占比，不改目标。
#
# 精确占比看 README 的「资产构成」表（自动生成），这里只记口径，避免每天漂。
# ⚠️ 纳指100 不算「稳」——它与标普500 相关性 0.9+，都是美股成长敞口，
#    只是纳指更偏科技、波动更大。所以 equity_pct 才是「权益类占比」，
#    不等于「稳健资产」。标普500 占比距下面 25–30% 的目标仍有缺口。
# 场外标普500 限购每日 20 元（每月约 ¥600）是硬上限；若要更快把占比
# 提到目标区间，走场内标普500 ETF，不受场外限购约束。
# 稳定币（约 ¥1.38 万）与人民币活钱（约 ¥0.60 万）都计入分子，详见 stablecoin / cash_cny 段。
asset_allocation:
  enabled: true
  # 标普500 的目标占比区间。低于下限 = 权益里「稳」的部分不足；
  # 高于上限 = 权益敞口偏高。现金类占比另看 equity_pct 与两项现金占比。
  sp500_target_range: [0.25, 0.30]
  note: "再平衡走场内标普500 ETF，不受场外每日 20 元限购约束"

# ------------------------------------------------------------
life_plan:
  enabled: true
  # 阶段 A 在哪个城市（牡丹江）——决定月开销、阶段 A 个人开销、出发门槛。
  profile: mudanjiang-rent-minimal # ← 改这一行即可切换方案

  # 不工作门槛（target_cny）按哪个城市算。默认 = 上面的 profile。
  # ⚠️ 阶段 A 与目标口径当前一致，都是牡丹江。保留这个字段，
  #    是为了防止「临时试算别的档位」时把进度条分母一起拖走。
  target_profile: mudanjiang-rent-minimal

  # 对照方案（未激活）：云南省内（城市待定，以玉溪红塔区为测算样本）。
  #    保留作为跨省成本对照，不参与任何目标计算；改回云南时再激活。
  #    换城市时改 city / province 与各项金额即可，其余自动重算；
  #    与其他城市的对比见 docs/FIRE-LIFE-PLAN.md §2。
  # ⚠️ 牡丹江极简档（mudanjiang-rent-minimal）才是当前基准方案，FIRE 目标分母来源。

  profiles:
    # 对照方案（未激活）：云南省内，具体城市待定。
    #
    # ⚠️ 毕业是 2029-06，三年后省内房价、租金与岗位都可能变化，
    #    所以「哪座城市」暂不写死；这一档只钉住「云南省内」这个范围。
    #    金额以目前唯一有完整调研数据的省内城市（玉溪红塔区，2026-11）
    #    为测算样本。选定城市后按规划书 §2.4 重算，改这一档即可。
    #
    # 数据依据（样本城市玉溪）：中国房价行情 2026-08 红塔区挂牌 ¥5,497/㎡、售租比 30 年；
    # 中国天气网玉溪气象数据（年均 17℃、最冷月 9℃、最热月 21-22℃、
    # 年日照 2100-2300 小时）；玉溪市人民医院三甲（2025 年复审通过）；
    # 云南省 2026-09-01 起二类地区小时最低工资 ¥21/小时。
    # 样本城市玉溪站→昆明南动车 32-39 分钟、¥29-40；昆明直飞北京约 3 小时。
    #
    # ⚠️ 省内普遍无集中供暖，取暖费为 0；5-10 月雨季相对湿度 79-80%，
    #    食品不能长期囤干货，除湿/防霉计入日用品与电费。
    # ⚠️ 房租、食品、探亲交通、电费均含估算，选定城市后须按当地物价重核。
    yunnan-rent-minimal:
      city: 云南省内（待定）
      province: 云南
      housing: rent
      household: 1
      lifestyle: 极简
      headline: 云南省内 · 单人 · 租房 · 极简（对照，未激活）
      items:
