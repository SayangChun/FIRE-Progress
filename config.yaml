# ============================================================
# FIRE-Progress 配置文件
# 所有可调参数集中在此，代码不硬编码任何口径。
# ============================================================

fire:
  # 月开销（元）。
  #   null = 由下面的 life_plan 逐项推导（推荐，每一分钱都能追溯到依据）
  #   数字 = 覆盖 life_plan 的结果，用于临时试算「如果每月只花 X 会怎样」
  monthly_expense: null
  withdrawal_rate: 0.043 # 提取率 4.3%
  currency: CNY
  currency_symbol: "¥"

# ------------------------------------------------------------
# FIRE 生活规划（Life Plan）
# ------------------------------------------------------------
# 目的：把「月开销」从拍脑袋的数字，换成一份可追溯的逐项预算。
#
#       FIRE 目标 = 月开销 × 12 ÷ 提取率
#
# 所以这里每一项金额都会直接改变 FIRE 目标、进而改变完成度。
# 改一项，全盘重算——这正是把它写进 config 而不是写进文档的原因。
#
# 口径：
#   1. 只统计「FIRE 之后」的经常性支出，不是当前的生活成本。
#   2. 一次性支出（搬家、押金、家具）不进月开销。它们不产生永续
#      现金流，混进「月开销 × 12 ÷ 提取率」会同时虚增月开销与目标，
#      所以单列在 one_off，另外加总。
#   3. 逐项都标注依据；凡估算值一律写明「估算」。
#
# 切换方案：改 life_plan.profile 一行即可，其余自动重算。
# 若 profile 写了不存在的名字，程序会直接报错，不会静默回落——
# 静默回落会让 FIRE 目标悄悄跑偏，比报错危险得多。
# ------------------------------------------------------------
life_plan:
  enabled: true
  profile: hegang-rent-minimal # ← 改这一行即可切换方案

  profiles:
    # 当前选定的基准方案。所有金额为 2026 年鹤岗口径的估算值，
    # 依据来自黑龙江省市监局/商务部生活必需品价格监测与实地实测报道。
    #
    # 2026-09-27 按「省钱项逐项确认」的结果下调了 6 项（房租/取暖/物业随面积、
    # 食品、日用品/衣物/娱乐、家电二手、网络手机、市内交通），月开销 ¥1905 → ¥1620。
    # 未采纳的省钱项（让房东付取暖费、年付折扣、峰谷电价、探亲票优化）
    # 与保留的安全垫（应急缓冲 ¥137、医疗自付 ¥80）都在各项 note 里注明。
    hegang-rent-minimal:
      city: 鹤岗
      province: 黑龙江
      housing: rent
      household: 1
      lifestyle: 极简
      headline: 鹤岗 · 单人 · 租房 · 极简
      items:
        - {key: rent, group: 住房与水电燃气, label: 房租, monthly: 430, note: "40㎡ 老城区一居室。鹤岗住宅均价 ¥2083/㎡、售租比 17，折算 40㎡ 月租约 ¥408-450，取 430。2026-09-27 由 50㎡ 换小"}
        - {key: heating, group: 住房与水电燃气, label: 取暖费, monthly: 80, note: "集中供暖。建筑面积 40㎡ × 87% 计费面积 × ¥27.5/㎡ ÷ 12 ≈ ¥80。随面积同步下调"}
        - {key: property_fee, group: 住房与水电燃气, label: 物业费, monthly: 10, note: "无正规物业的老旧小区约 ¥0.2/㎡/月；公共维修自理"}
        - {key: water, group: 住房与水电燃气, label: 水费, monthly: 12, note: "单人约 3 吨/月"}
        - {key: electricity, group: 住房与水电燃气, label: 电费, monthly: 55, note: "约 110 度/月。冬季靠集中供暖，不需要电暖器，用电量低于南方。峰谷分时经评估后未采用"}
        - {key: gas, group: 住房与水电燃气, label: 燃气/液化气, monthly: 35, note: "自己做饭，约 1/3 罐 15kg 液化气/月；有管道燃气的楼栋会更便宜"}
        - {key: appliance, group: 住房与水电燃气, label: 家电维修与更换摊销, monthly: 20, note: "改买二手：鹤岗二手房源多、二手家电便宜（洗衣机约 ¥200-300）。按 10 年摊销，无保修"}
        - {key: telecom, group: 日常开销, label: 网络与手机, monthly: 30, note: "纯流量卡约 ¥29/月，不装宽带（用手机热点）。代价：依赖手机信号，大流量受限"}
        - {key: food, group: 日常开销, label: 食品, monthly: 430, note: "约 ¥14/天。早市采购 + 10 月囤冬菜腌酸菜 + 提高豆制品与鸡蛋比例、减少红肉。东北菜价：大米约 ¥6/kg、鸡蛋约 ¥8/kg、蔬菜约 ¥8-10/kg"}
        - {key: drinking_water, group: 日常开销, label: 饮用水, monthly: 15, note: "桶装水或净水器滤芯；自来水费已单列在水费里"}
        - {key: supplies, group: 日常开销, label: 日用品, monthly: 50, note: "洗护、纸品、清洁等，含理发"}
        - {key: transport, group: 日常开销, label: 交通, monthly: 20, note: "步行/骑车为主，不买公交月卡。注意：鹤岗冬季最低 −30℃，可行性需实地验证"}
        - {key: home_visit, group: 日常开销, label: 探亲与返乡交通, monthly: 100, note: "每年 1-2 次往返，单次火车往返约 ¥1000，折算 ≈ ¥100/月。硬座/折扣票未采用"}
        - {key: clothing, group: 日常开销, label: 衣物, monthly: 30, note: "按年摊销，含冬装更新。东北冬装单价高但更新慢"}
        - {key: misc, group: 日常开销, label: 娱乐与杂项, monthly: 40, note: "极简档：几乎不外食、不旅行，含软件订阅与域名"}
        - {key: resident_medical, group: 医疗与保障, label: 城乡居民医保, monthly: 33, note: "¥400/年，2026 年国家统一标准。不交社保后这是唯一的兜底医保"}
        - {key: huiminbao, group: 医疗与保障, label: 惠民保, monthly: 13, note: "龙江惠民保升级版 ¥150/年，补充医保目录外费用。以当年实际保费为准"}
        - {key: medical_buffer, group: 医疗与保障, label: 医疗自付预留, monthly: 80, note: "居民医保报销比例低于职工医保，门诊与小额自付需自己留出。不建议压缩"}
        - {key: buffer, group: 风险缓冲, label: 应急与物价缓冲, monthly: 137, note: "按月留一笔机动钱，应付物价波动与临时支出；此项同时用于把合计取整到 ¥1620。经确认不下调"}

    # 对照方案：同样在鹤岗租房，但生活档次放宽到常规
    # （每周外食 2-3 次、每年一次短途旅行、公交+偶尔打车）。
    hegang-rent-normal:
      city: 鹤岗
      province: 黑龙江
      housing: rent
      household: 1
      lifestyle: 常规
      headline: 鹤岗 · 单人 · 租房 · 常规
      items:
        - {key: rent, group: 住房与水电燃气, label: 房租, monthly: 600, note: "一居室精装或小两居"}
        - {key: heating, group: 住房与水电燃气, label: 取暖费, monthly: 120, note: "建筑面积 60㎡ × 87% × ¥27.5/㎡ ÷ 12"}
        - {key: property_fee, group: 住房与水电燃气, label: 物业费, monthly: 30, note: "有正规物业的小区"}
        - {key: water, group: 住房与水电燃气, label: 水费, monthly: 15, note: "单人约 4 吨/月"}
        - {key: electricity, group: 住房与水电燃气, label: 电费, monthly: 70, note: "约 140 度/月"}
        - {key: gas, group: 住房与水电燃气, label: 燃气/液化气, monthly: 45, note: "做饭频次更高"}
        - {key: appliance, group: 住房与水电燃气, label: 家电维修与更换摊销, monthly: 40, note: "洗衣机、冰箱等按 10 年更换摊销"}
        - {key: telecom, group: 日常开销, label: 网络与手机, monthly: 70, note: "更高带宽 + 流量套餐"}
        - {key: food, group: 日常开销, label: 食品, monthly: 750, note: "含每周 2-3 次外食"}
        - {key: drinking_water, group: 日常开销, label: 饮用水, monthly: 20, note: "桶装水或净水器滤芯"}
        - {key: supplies, group: 日常开销, label: 日用品, monthly: 80, note: "洗护、纸品、清洁等"}
        - {key: transport, group: 日常开销, label: 交通, monthly: 120, note: "公交月卡 + 偶尔打车"}
        - {key: home_visit, group: 日常开销, label: 探亲与返乡交通, monthly: 100, note: "每年 1-2 次往返，单次火车往返约 ¥1000，折算 ≈ ¥100/月"}
        - {key: clothing, group: 日常开销, label: 衣物, monthly: 100, note: "按年摊销"}
        - {key: misc, group: 日常开销, label: 娱乐与杂项, monthly: 150, note: "含每年一次短途旅行的摊销"}
        - {key: resident_medical, group: 医疗与保障, label: 城乡居民医保, monthly: 33, note: "¥400/年，2026 年国家统一标准"}
        - {key: huiminbao, group: 医疗与保障, label: 惠民保, monthly: 13, note: "龙江惠民保升级版 ¥150/年"}
        - {key: medical_buffer, group: 医疗与保障, label: 医疗自付预留, monthly: 120, note: "门诊与小额自付"}
        - {key: buffer, group: 风险缓冲, label: 应急与物价缓冲, monthly: 184, note: "按月留一笔机动钱；此项同时用于把合计取整到 ¥2660"}

  # 一次性支出：不进入「月开销 × 12 ÷ 提取率」，单独加总。
  # 它们只在 FIRE 落地的那一年发生一次。
  one_off:
    - {key: deposit, label: 租房押金, amount: 1000, note: "押一付三中的押金，退租时返还；按 2 个月租金估算"}
    - {key: moving, label: 搬家与长途运输, amount: 3000, note: "从北京到鹤岗，含打包与物流"}
    - {key: furniture, label: 家具家电添置, amount: 8000, note: "出租房常不带全套家电；洗衣机、冰箱、床、桌椅等"}
    - {key: winter_kit, label: 过冬装备, amount: 3000, note: "羽绒服、雪地靴、厚被褥等，一次性投入"}

# ------------------------------------------------------------
# 数据来源
# 口径：只统计「比特币持仓」与「标普500基金持仓」两项。
#       其他一切资产（法币、其他币种、其他账户）不计入。
# ------------------------------------------------------------
sources:
  # 比特币持仓：读取 0.1BTC 仓库的 data/holdings.csv
  # 该文件由本人每周手动更新，因此数据存在延迟，不是实时持仓。
  btc:
    enabled: true
    repo: "SayangChun/0.1BTC"
    ref: main
    holdings_path: "data/holdings.csv"
    # 快照超过这个天数未更新就在 README 顶部告警（每周更新 → 14 天是合理阈值）
    max_stale_days: 14
    # 是否从备注里解析「均价 $xx/BTC」推算成本（best-effort，解析失败则跳过）
    derive_cost_from_note: true

  sp500:
    enabled: true
    repo: "SayangChun/sp500-dca"
    ref: main
    portfolio_path: "data/portfolio.json"
    timeline_path: "data/timeline.json"

# ------------------------------------------------------------
# 价格与汇率
# 持仓数量来自仓库，但估值仍需实时行情折算成人民币。
# ------------------------------------------------------------
price:
  btc_sources: # 按顺序尝试，取第一个成功的
    - binance # api.binance.com
    - binance_vision # data-api.binance.vision（公共行情，限制更少）
    - okx # www.okx.com
  fx_sources:
    - er-api # open.er-api.com
    - frankfurter # api.frankfurter.dev
  fallback_fx_usdcny: 7.10 # 全部汇率源失败时的兜底值

# ------------------------------------------------------------
# 本金（可选）
# 留 null 则 README 不显示该项，避免出现编造的数字。
# ------------------------------------------------------------
cost_basis:
  sp500_cny: null # 留 null 时自动取 sp500-dca 仓库中的 invested
  # 比特币本金：从 holdings.csv 备注中的「均价 $xx/BTC」推算，
  # 并按当前汇率折算成人民币，属于估算值，README 会标注。

# ------------------------------------------------------------
# 隐私
#   full   = 显示精确金额
#   masked = 只显示百分比与进度条，金额以数量级模糊展示
# 注意：本仓库为公开仓库，full 模式会公开你的精确持仓金额。
# ------------------------------------------------------------
privacy:
  mode: full

# ------------------------------------------------------------
# 展示
# ------------------------------------------------------------
display:
  show_projection: true # 按近期增速线性外推（非预测，可关闭）
  projection_window_days: 30
  show_curve: true
  curve_days: 90
  show_life_plan: true # 在 README 里展示月开销明细（FIRE 生活预算）

# ------------------------------------------------------------
# 自动化
# ------------------------------------------------------------
automation:
  timezone: "Asia/Shanghai"
  # 提交门控：变动不够大就不提交，避免刷屏。
  #
  # 阈值取「绝对下限」与「总资产 × 比例」中的较大者：
  # 用比例而非固定金额，是因为固定金额不随资产规模变化——
  # 资产小的时候 1 元就是 0.007%（几乎每小时都触发），
  # 资产大了之后同样的金额又变得毫无意义。
  min_commit_delta_ratio: 0.003 # 总资产变动达到 0.3% 才提交
  min_commit_delta_cny: 1.0 # 绝对下限，防止资产很小时被分币级波动触发
  # 另外：跨天必定提交一次，保证进度曲线每天至少有一个数据点。
