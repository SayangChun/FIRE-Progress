# ============================================================
# FIRE-Progress 配置文件
# 所有可调参数集中在此，代码不硬编码任何口径。
# ============================================================

fire:
  # 月开销（元）。
  #   null = 由下面的 life_plan 逐项推导（推荐，每一分钱都能追溯到依据）
  #   数字 = 覆盖 life_plan 的结果，用于临时试算「如果每月只花 X 会怎样」
  monthly_expense: null
  withdrawal_rate: 0.043 # 提取率 4.3%
  currency: CNY
  currency_symbol: "¥"

  # ----------------------------------------------------------
  # 兼职收入（咖啡师 FIRE）
  # ----------------------------------------------------------
  # 2026-10-20 口径变更：确认走的是**咖啡师 FIRE**，不是传统 FIRE。
  # FIRE 之后仍会做「低压力、可随时停、不需要 career」的兼职，
  # 这份收入用来覆盖一部分生活开销，所以不需要靠资产覆盖全部开销。
  #
  # 目标公式由
  #     月开销 × 12 ÷ 提取率
  # 改为
  #     (月开销 − 兼职净收入) × 12 ÷ 提取率
  #
  # ⚠️ 只扣「因为工作才产生」的增量消耗，不扣本来就要花的钱。
  #    比如在外吃饭只算比在家吃贵出来的那部分——家里那顿的成本
  #    已经在 life_plan 的「食品」里了，全额扣等于重复计算。
  #
  # ⚠️ enabled: false 时完全退回传统 FIRE 口径，结果与 10-20 之前一致。
  #    这条留着的意义：随时能对比「如果完全靠资产」要攒多少。
  #
  # ⚠️ 净收入 ≥ 月开销会直接报错。那意味着「不用攒钱就能 FIRE」，
  #    实务上几乎一定是配置写错了，静默算出目标 0 比报错危险得多。
  labor_income:
    enabled: true
    label: 咖啡师 FIRE · 兼职

    # 时薪：牡丹江市区非全日制小时最低工资标准，2025-12-01 起执行（第二档）。
    # 黑龙江省三档：哈尔滨市区/大庆市区 21 元、牡丹江市区等 18.8 元、县市 18.2 元。
    # 取法定下限而不是市场均值——这是「最保守的合法口径」：
    # 市场实际可能更高（职友集牡丹江咖啡师全职 ¥3–6K/月），但取高值会让目标偏乐观。
    hourly_wage: 18.8

    # 每周 2 天 × 每天 4 小时。月工时按 52 周 ÷ 12 折算，不按 4 周（会少算 8%）。
    hours_per_week: 8
    work_days_per_week: 2

    # 交通：牡丹江公交 ¥1/人次（一票制），往返 ¥2。
    # 冬季 −25℃ 骑不了车，所以全年按公交算，不按「骑车零成本」美化。
    transport_per_day: 2.0

    # 往返通勤时间（小时）。不产生现金支出，但**要算进等效时薪**——
    # 4 小时班 + 1 小时通勤 = 实际占用 5 小时，等效时薪比名义时薪低 20%。
    # 这个数只用于展示，不参与 FIRE 目标计算。
    commute_hours_per_day: 1.0

    # 餐食增量：半天班偶尔跨饭点，每月约 3–4 次在外解决。
    # 只算比在家做饭贵出来的差额（约 ¥7/顿），不是一顿饭的全价。
    meal_increment_monthly: 25.0

    # 装备摊销：工服由店方提供，个人只需防滑鞋。¥150 ÷ 2 年。
    gear_monthly: 6.0

    note: "工作不只是为了赚钱，也是为了体验生活和融入社会。咖啡师在这里是隐喻：低压力、可随时停、不需要 career 的兼职。"

# ------------------------------------------------------------
# FIRE 生活规划（Life Plan）
# ------------------------------------------------------------
# 目的：把「月开销」从拍脑袋的数字，换成一份可追溯的逐项预算。
#
#       FIRE 目标 = 月开销 × 12 ÷ 提取率
#
# 所以这里每一项金额都会直接改变 FIRE 目标、进而改变完成度。
# 改一项，全盘重算——这正是把它写进 config 而不是写进文档的原因。
#
# 口径：
#   1. 只统计「FIRE 之后」的经常性支出，不是当前的生活成本。
#   2. 一次性支出（搬家、押金、家具）不进月开销。它们不产生永续
#      现金流，混进「月开销 × 12 ÷ 提取率」会同时虚增月开销与目标，
#      所以单列在 one_off，另外加总。
#   3. 逐项都标注依据；凡估算值一律写明「估算」。
#
# 切换方案：改 life_plan.profile 一行即可，其余自动重算。
# 若 profile 写了不存在的名字，程序会直接报错，不会静默回落——
# 静默回落会让 FIRE 目标悄悄跑偏，比报错危险得多。
# ------------------------------------------------------------
life_plan:
  enabled: true
  profile: mudanjiang-rent-minimal # ← 改这一行即可切换方案

  # ⚠️ 定居地已限定为「黑龙江省内」；省内具体城市尚未确定。
  #    牡丹江只是当前代入的占位城市，不代表已经决定。
  #    确定城市后改 city / province 与各项金额即可，其余自动重算。
  #    省内候选城市对比见 docs/FIRE-LIFE-PLAN.md §2。

  profiles:
    # 当前基准方案。金额为 2026 年牡丹江口径的估算值。
    #
    # 数据依据：牡丹江市区二手房均价 ¥4,292/㎡、租售比 3.73%（聚汇数据 2026-09）；
    # 居民供热 ¥28/㎡ 按【使用面积】计收（约合建筑面积 80%）；
    # 医保 ¥400/年 与龙江惠民保 ¥150/年 为黑龙江省统一标准。
    #
    # 2026-09-27 按「省钱项逐项确认」下调了 6 项（面积、食品、日用品/衣物/娱乐、
    # 家电二手、网络手机、市内交通），并保留全部安全垫（应急缓冲、医疗自付、惠民保）。
    mudanjiang-rent-minimal:
      city: 牡丹江
      province: 黑龙江
      housing: rent
      household: 1
      lifestyle: 极简
      headline: 牡丹江 · 单人 · 租房 · 极简
      items:
        - {key: rent, group: 住房与水电燃气, label: 房租, monthly: 500, note: "40㎡ 一居室。房天下 2026-10 实际挂牌：一居室区间 ¥400-850（爱民吉祥花园 50㎡ ¥400、龙门鑫家园 57㎡ ¥450 为低位）。原按均价×租售比推得 ¥534，2026-10-08 结合真实房源取 ¥500"}
        - {key: heating, group: 住房与水电燃气, label: 取暖费, monthly: 75, note: "居民供热 ¥28/㎡ 按【使用面积】计收（约合建筑面积 80%）。40㎡ × 80% × ¥28 ÷ 12 ≈ ¥75。⚠️ 2026-10-08 查证：是否含在租金内【因房源而异】（房天下把「房租包含取暖费吗」做成逐套问答字段），无「大部分包」的证据；且即使房东包，成本通常已折算进租金。故按租客自付保守建模——看房时务必逐套问清并写进合同"}
        - {key: property_fee, group: 住房与水电燃气, label: 物业费, monthly: 15, note: "¥0.375/㎡·月 × 40㎡。牡丹江物业费实行政府指导价并按服务分级，有电梯与无电梯差约一倍；原按 ¥0.6/㎡（≈二级无电梯）建模，2026-10-08 下调到三级无电梯档。⚠️ 与取暖费同理：房天下把「房租包含物业费吗」做成逐套问答字段，即使房东交也可能折算进租金——看房时逐套问清并写进合同"}
        - {key: water, group: 住房与水电燃气, label: 水费, monthly: 12, note: "单人约 3 吨/月"}
        - {key: electricity, group: 住房与水电燃气, label: 电费, monthly: 55, note: "约 110 度/月。冬季靠集中供暖，不需要电暖器，用电量低于南方。峰谷分时经评估后未采用"}
        - {key: gas, group: 住房与水电燃气, label: 燃气/液化气, monthly: 35, note: "自己做饭；牡丹江管道燃气覆盖较好，可能低于此值"}
        - {key: appliance, group: 住房与水电燃气, label: 家电维修与更换摊销, monthly: 20, note: "改买二手（约 ¥200-300）。按 10 年摊销，无保修"}
        - {key: telecom, group: 日常开销, label: 网络与手机, monthly: 30, note: "纯流量卡约 ¥29/月，不装宽带（用手机热点）。代价：依赖手机信号，大流量受限"}
        - {key: food, group: 日常开销, label: 食品, monthly: 300, note: "偏紧档 ¥300（约 ¥10/天，16:8 两餐）。挂面为主食、鸡蛋+豆腐作主力蛋白、猪肉约 2.5kg/月；蔬菜靠早市+10月冬储；含少量乳制品与水果。⚠️ 2026-10-13 由 ¥319 下调：他确认自己有【线上批量采购便宜货源】的能力 → 购物篮不变、单价下降，降幅落在主食、油盐调味、乳制品、零食等【耐储可囤】的品类；蔬菜水果仍走早市，线上帮不上。构成见规划书 §6.5"}
        - {key: drinking_water, group: 日常开销, label: 饮用水, monthly: 15, note: "桶装水或净水器滤芯；自来水费已单列在水费里"}
        - {key: supplies, group: 日常开销, label: 日用品, monthly: 22, note: "极限档 ¥22：香皂替代洗发水与沐浴露、洗衣皂替代洗衣液、小苏打+白醋替代专用清洁剂。含洗护、清洁、垃圾袋与杂项摊销。理发已改为自理，不再计入。⚠️ 2026-10-13 由 ¥28 下调：纸巾部分（原 ¥6/月）不再占用本预算，本项只剩非纸品部分"}
        - {key: transport, group: 日常开销, label: 交通, monthly: 30, note: "牡丹江市区面积较大，公交月卡与骑车并用。冬季约 −25℃，11-3 月需留公交余量"}
        - {key: home_visit, group: 日常开销, label: 探亲与返乡交通, monthly: 100, note: "每年 1-2 次往返，单次火车往返约 ¥1000，折算 ≈ ¥100/月。牡丹江是铁路枢纽（哈牡、牡佳高铁交汇），往返便利"}
        - {key: clothing, group: 日常开销, label: 衣物, monthly: 30, note: "按年摊销，含冬装更新。东北冬装单价高但更新慢"}
        - {key: misc, group: 日常开销, label: 杂项（快递与小额）, monthly: 5, note: "2026-09-29 拆细后确认：无域名、无代理订阅、无视频音乐会员、无云存储、付费 AI 为 ¥0、娱乐与外食为 ¥0。仅保留快递与零星小额支出。⚠️ 若实际有代理订阅需加回 ¥10-30"}
        - {key: resident_medical, group: 医疗与保障, label: 城乡居民医保, monthly: 33, note: "¥400/年，2026 年国家统一标准。不交社保后这是唯一的兜底医保"}
        - {key: huiminbao, group: 医疗与保障, label: 惠民保, monthly: 13, note: "龙江惠民保升级版 ¥150/年，黑龙江省统一。以当年实际保费为准"}
        - {key: medical_buffer, group: 医疗与保障, label: 医疗自付预留, monthly: 80, note: "居民医保报销比例低于职工医保，门诊与小额自付需自己留出。不建议压缩"}
        - {key: buffer, group: 风险缓冲, label: 应急与物价缓冲, monthly: 137, note: "按月留一笔机动钱，应付物价波动与临时支出；经确认不下调，这是安全垫，不建议压缩"}

    # 对照方案：同样在牡丹江租房，但生活档次放宽到常规
    # （每周外食 2-3 次、每年一次短途旅行、公交 + 偶尔打车）。
    mudanjiang-rent-normal:
      city: 牡丹江
      province: 黑龙江
      housing: rent
      household: 1
      lifestyle: 常规
      headline: 牡丹江 · 单人 · 租房 · 常规
      items:
        - {key: rent, group: 住房与水电燃气, label: 房租, monthly: 700, note: "一居室精装或小两居"}
        - {key: heating, group: 住房与水电燃气, label: 取暖费, monthly: 100, note: "60㎡ × 80% 使用面积 × ¥28/㎡ ÷ 12"}
        - {key: property_fee, group: 住房与水电燃气, label: 物业费, monthly: 35, note: "有正规物业的小区"}
        - {key: water, group: 住房与水电燃气, label: 水费, monthly: 15, note: "单人约 4 吨/月"}
        - {key: electricity, group: 住房与水电燃气, label: 电费, monthly: 70, note: "约 140 度/月"}
        - {key: gas, group: 住房与水电燃气, label: 燃气/液化气, monthly: 45, note: "做饭频次更高"}
        - {key: appliance, group: 住房与水电燃气, label: 家电维修与更换摊销, monthly: 40, note: "洗衣机、冰箱等按 10 年更换摊销"}
        - {key: telecom, group: 日常开销, label: 网络与手机, monthly: 70, note: "更高带宽 + 流量套餐"}
        - {key: food, group: 日常开销, label: 食品, monthly: 800, note: "含每周 2-3 次外食"}
        - {key: drinking_water, group: 日常开销, label: 饮用水, monthly: 20, note: "桶装水或净水器滤芯"}
        - {key: supplies, group: 日常开销, label: 日用品, monthly: 82, note: "常规档：正常品牌与用量，含理发 ¥20"}
        - {key: transport, group: 日常开销, label: 交通, monthly: 120, note: "公交月卡 + 偶尔打车"}
        - {key: home_visit, group: 日常开销, label: 探亲与返乡交通, monthly: 100, note: "每年 1-2 次往返"}
        - {key: clothing, group: 日常开销, label: 衣物, monthly: 100, note: "按年摊销"}
        - {key: misc, group: 日常开销, label: 娱乐与杂项, monthly: 150, note: "含每年一次短途旅行的摊销"}
        - {key: resident_medical, group: 医疗与保障, label: 城乡居民医保, monthly: 33, note: "¥400/年，2026 年国家统一标准"}
        - {key: huiminbao, group: 医疗与保障, label: 惠民保, monthly: 13, note: "龙江惠民保升级版 ¥150/年"}
        - {key: medical_buffer, group: 医疗与保障, label: 医疗自付预留, monthly: 120, note: "门诊与小额自付"}
        - {key: buffer, group: 风险缓冲, label: 应急与物价缓冲, monthly: 187, note: "按月留一笔机动钱；此项同时用于把合计取整到 ¥2800"}

  # 一次性支出：不进入「月开销 × 12 ÷ 提取率」，单独加总。
  # 它们只在 FIRE 落地的那一年发生一次。
  one_off:
    - {key: deposit, label: 租房押金, amount: 1000, note: "押一付三中的押金，退租时返还；按 2 个月租金估算"}
    - {key: moving, label: 搬家与长途运输, amount: 3000, note: "从北京到牡丹江，含打包与物流"}
    - {key: furniture, label: 家具家电添置, amount: 8000, note: "出租房常不带全套家电；洗衣机、冰箱、床、桌椅等"}
    - {key: winter_kit, label: 过冬装备, amount: 3000, note: "羽绒服、雪地靴、厚被褥等，一次性投入"}

# ------------------------------------------------------------
# 数据来源
# 口径：统计「长期不动用的可投资资产」——比特币、标普500基金。
#       日常现金与活期要参与周转、随花随有，不计入。
# ------------------------------------------------------------
sources:
  # 比特币持仓：读取 0.1BTC 仓库的 data/holdings.csv
  # 该文件由本人每周手动更新，因此数据存在延迟，不是实时持仓。
  btc:
    enabled: true
    repo: "SayangChun/0.1BTC"
    ref: main
    holdings_path: "data/holdings.csv"
    # 快照超过这个天数未更新就在 README 顶部告警（每周更新 → 14 天是合理阈值）
    max_stale_days: 14
    # 是否从备注里解析「均价 $xx/BTC」推算成本（best-effort，解析失败则跳过）
    derive_cost_from_note: true

  sp500:
    enabled: true
    repo: "SayangChun/sp500-dca"
    ref: main
    portfolio_path: "data/portfolio.json"
    timeline_path: "data/timeline.json"

# ------------------------------------------------------------
# 价格与汇率
# 持仓数量来自仓库，但估值仍需实时行情折算成人民币。
# ------------------------------------------------------------
price:
  btc_sources: # 按顺序尝试，取第一个成功的
    - binance # api.binance.com
    - binance_vision # data-api.binance.vision（公共行情，限制更少）
    - okx # www.okx.com
  fx_sources:
    - er-api # open.er-api.com
    - frankfurter # api.frankfurter.dev
  fallback_fx_usdcny: 7.10 # 全部汇率源失败时的兜底值

# ------------------------------------------------------------
# 本金（可选）
# 留 null 则 README 不显示该项，避免出现编造的数字。
# ------------------------------------------------------------
cost_basis:
  sp500_cny: null # 留 null 时自动取 sp500-dca 仓库中的 invested
  # 比特币本金：从 holdings.csv 备注中的「均价 $xx/BTC」推算，
  # 并按当前汇率折算成人民币，属于估算值，README 会标注。

# ------------------------------------------------------------
# 预期年化回报
# ------------------------------------------------------------
# 只用于估算「每小时被动收入」，**不参与 FIRE 目标的任何计算**。
# 目标 = 月开销 × 12 ÷ 提取率，与回报率无关；改这里不会让目标动一个分。
#
# ⚠️ 这些数字是**假设**，不是预测，也不是承诺。取值原则：
#    既不取历史最好成绩，也不取最坏情形，取「讲得出理由的中枢」。
#
#   比特币 12%
#     历史 CAGR 极高（十年维度 50%+），但那是从极小基数出发的，不可外推。
#     机构长期假设多落在 10%–20%（Strategy 的 20%–30% 属乐观端）。
#     取 12%：高于股票的风险溢价，但远低于历史，对应「渗透率继续提升、
#     但速度明显放缓」。区间 0%（渗透停滞）~ 25%（继续抢黄金份额）。
#
#   标普500 6%（扣费后、人民币口径）
#     长期名义回报约 10%，但当前 CAPE 38–41 处于历史 95%+ 分位；
#     历史同类估值起点的十年回报中枢明显更低（有研究给到实际负回报）。
#     扣掉 QDII 基金约 0.6%–0.8% 的费率后取 6%。区间 3%–9%。
#     汇率按 0% 漂移处理——升值与贬值理由互相抵消，不做方向性下注。
#
# 区间不是摆设：把它们代进去，加权年化会从 0.1% 摆到 24%。
# 这个宽度说明「每小时被动收入」是个量级参考，不是一个可以拿去做预算的数。
expected_return:
  btc: 0.12
  btc_low: 0.00
  btc_high: 0.25
  sp500: 0.06
  sp500_low: 0.03
  sp500_high: 0.09

# ------------------------------------------------------------
# 隐私
#   full   = 显示精确金额
#   masked = 只显示百分比与进度条，金额以数量级模糊展示
# 注意：本仓库为公开仓库，full 模式会公开你的精确持仓金额。
# ------------------------------------------------------------
privacy:
  mode: full

# ------------------------------------------------------------
# 展示
# ------------------------------------------------------------
display:
  show_projection: true # 按近期增速线性外推（非预测，可关闭）
  projection_window_days: 30
  # 自绘 SVG 进度条（reports/progress.svg）。
  # 不用 shields.io 徽章：那是不可控的外部服务，大陆网络时通时不通，
  # 且 label 含中文时未 URL 编码会直接返回 404；文本进度条则受字体宽度影响。
  show_progress_bar: true
  show_curve: true
  curve_days: 90
  # 收益曲线（reports/profit.svg）：累计投入 vs 当前市值，缺口即累计盈亏。
  # 数据来自 history.json 里的 basis_cny / profit_cny —— 必须逐日留档，
  # 事后无法精确重建（比特币本金要历史汇率），所以当天不记就永久丢失。
  show_profit_curve: true
  show_life_plan: true # 在 README 里展示月开销明细（FIRE 生活预算）
  # 每小时被动收入：当前持仓 × 预期年化回报 ÷ 8760。
  # 这是**假设性测算**，口径见上面的 expected_return 段。
  show_passive_income: true

# ------------------------------------------------------------
# 自动化
# ------------------------------------------------------------
automation:
  timezone: "Asia/Shanghai"
  # 提交门控：变动不够大就不提交，避免刷屏。
  #
  # 阈值取「绝对下限」与「总资产 × 比例」中的较大者：
  # 用比例而非固定金额，是因为固定金额不随资产规模变化——
  # 资产小的时候 1 元就是 0.007%（几乎每小时都触发），
  # 资产大了之后同样的金额又变得毫无意义。
  min_commit_delta_ratio: 0.003 # 总资产变动达到 0.3% 才提交
  min_commit_delta_cny: 1.0 # 绝对下限，防止资产很小时被分币级波动触发
  # 另外：跨天必定提交一次，保证进度曲线每天至少有一个数据点。
