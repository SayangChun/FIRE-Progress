# ============================================================
# FIRE-Progress 配置文件
# 所有可调参数集中在此，代码不硬编码任何口径。
# ============================================================

fire:
  # 月开销（元）。
  #   null = 由下面的 life_plan 逐项推导（推荐，每一分钱都能追溯到依据）
  #   数字 = 覆盖 life_plan 的结果，用于临时试算「如果每月只花 X 会怎样」
  monthly_expense: null
  withdrawal_rate: 0.043 # 提取率 4.3%
  currency: CNY
  currency_symbol: "¥"

  # ----------------------------------------------------------
  # 兼职收入（咖啡师 FIRE）
  # ----------------------------------------------------------
  # 2026-10-20 口径变更：确认走的是**咖啡师 FIRE**，不是传统 FIRE。
  # FIRE 之后仍会做「低压力、可随时停、不需要 career」的兼职，
  # 这份收入用来覆盖一部分生活开销，所以不需要靠资产覆盖全部开销。
  #
  # 目标公式由
  #     月开销 × 12 ÷ 提取率
  # 改为
  #     (月开销 − 兼职净收入) × 12 ÷ 提取率
  #
  # ⚠️ 只扣「因为工作才产生」的增量消耗，不扣本来就要花的钱。
  #    比如在外吃饭只算比在家吃贵出来的那部分——家里那顿的成本
  #    已经在 life_plan 的「食品」里了，全额扣等于重复计算。
  #
  # ⚠️ enabled: false 时完全退回传统 FIRE 口径，结果与 10-20 之前一致。
  #    这条留着的意义：随时能对比「如果完全靠资产」要攒多少。
  #
  # ⚠️ 净收入 ≥ 月开销会直接报错。那意味着「不用攒钱就能 FIRE」，
  #    实务上几乎一定是配置写错了，静默算出目标 0 比报错危险得多。
  labor_income:
    enabled: true
    label: 咖啡师 FIRE · 兼职

    # 时薪：**2026-10-25 他自定为 ¥15**（原为 ¥18.8），刻意取低，让目标偏保守。
    # 市场参考：职友集牡丹江咖啡师全职 ¥3–6K/月，折 ¥17–35/小时——¥15 是往下压，不是往上估。
    hourly_wage: 15

    # 每周 3 天 × 每天 4 小时 = 12 小时/周。月工时按 52 周 ÷ 12 折算，不按 4 周（会少算 8%）。
    # ⚠️ 2026-10-25：他说明「兼职时间也是不确定的」——3 天只是当前假设。
    #    工时是乘数：每增减一天（4h），FIRE 目标差约 ¥70,140。敏感性见规划书 §7.4。
    hours_per_week: 12
    work_days_per_week: 3

    # 交通：牡丹江公交 ¥1/人次（一票制），往返 ¥2。
    # 冬季 −25℃ 骑不了车，所以全年按公交算，不按「骑车零成本」美化。
    transport_per_day: 2.0

    # 往返通勤时间（小时）。不产生现金支出，但**要算进等效时薪**——
    # 4 小时班 + 1 小时通勤 = 实际占用 5 小时，等效时薪比名义时薪低 20%。
    # 这个数只用于展示，不参与 FIRE 目标计算。
    commute_hours_per_day: 1.0

    # 餐食增量：半天班偶尔跨饭点，每月约 3–4 次在外解决。
    # 只算比在家做饭贵出来的差额（约 ¥7/顿），不是一顿饭的全价。
    meal_increment_monthly: 25.0

    # 装备摊销：工服由店方提供，个人只需防滑鞋。¥150 ÷ 2 年。
    gear_monthly: 6.0

    note: "工作不只是为了赚钱，也是为了体验生活和融入社会。咖啡师在这里是隐喻：低压力、可随时停、不需要 career 的兼职。"

  # ----------------------------------------------------------
  # 全职情景（2026-10-31 新增）
  # ----------------------------------------------------------
  # ⚠️ 这一段**不参与 FIRE 目标计算**，只做现金流展示与决策参考。
  #
  # 原因：全职净收入必然超过月开销（¥1,461），代进
  #     (月开销 − 净收入) × 12 ÷ 提取率
  # 会得到负数。负数不是「超额完成」，而是「这个公式在这里没有答案」——
  # 它回答的是「资产要多大才能替代工资」，而全职本身就有工资。
  # 所以 `_net_after_labor` 仍然只读 labor_income（兼职兜底），
  # 全职的现金流单独算、单独展示，绝不进入 target_cny。
  #
  # 2026-10-31 他给出的新方案：不再以写作为主，愿意做全职，
  # 前提是「适合自己的轻松工作，工资可以很低」；找不到就做兼职，
  # 一直到回北京。所以全职是首选、兼职是兜底，
  # **FIRE 目标仍按兼职兜底口径（¥205,953.49）计算**，不改。
  fulltime:
    enabled: true
    label: 全职 · 图书馆保安（包吃住）
    # ⚠️ 工资高低对阶段 A 几乎无影响：保安岗普遍包吃住，个人现金开销极低
    # （见下面 room_and_board_covered）。¥17/h 取自 0453 招聘的超市晚间理货实测
    # （见 FIRE-ROADMAP.md §3.3），属保守占位——真实工资低一些也不改变
    # 「阶段 A 净流出≈0、盈余全归定投」的结构。
    # 注意这不是「最低工资」——黑龙江非全日制第二档 ¥18.8/h，取 ¥17 留保守余量。
    hourly_wage: 17
    hours_per_week: 40
    work_days_per_week: 5
    transport_per_day: 2.0
    commute_hours_per_day: 1.0
    # 全职每天 8h 必然跨午饭：22 个工作日 × ¥7 增量（只算比在家做贵出的差额）。
    # ⚠️ 包吃住覆盖正餐后，这 ¥154 已是保守保留——真按「单位管饭」应归 0，
    # 这里不归零是为了不夸大部分盈余，阶段 A 个人开销的下降全部来自下面的 covered_keys。
    meal_increment_monthly: 154.0
    # 全职着装与鞋耗比兼职快
    gear_monthly: 10.0
    # ----------------------------------------------------------
    # 包吃住：阶段 A 工作期间，房租 / 取暖 / 物业费 / 食品 / 饮用水由单位提供，
    # 个人仍需自付的部分见 life_plan 其余项（约 ¥556/月：通讯、交通、探亲、
    # 医疗自付、应急缓冲等）。covered_keys 列出的 life_plan 项被「包吃住」覆盖，
    # 不计入阶段 A 个人开销。
    # ⚠️ **仅用于计算阶段 A 盈余**，绝不改变 FIRE 目标 ¥205,953.49——
    # 目标是不工作、自己负担全部开销的状态，而包吃住只在「有工作」时成立。
    # 改这里不会影响 README 上的 FIRE 目标与完成度（见 tests/test_departure_fulltime.py）。
    room_and_board_covered: true
    covered_keys: [rent, heating, property_fee, food, drinking_water]
    note: "首选方案的具体形态：图书馆保安。低刺激、围绕书、可随时停；且普遍包吃住，个人现金开销极低。找不到时退回 labor_income 的兼职口径，目标随即回到 ¥205,953.49。"

# ------------------------------------------------------------
# FIRE 生活规划（Life Plan）
# ------------------------------------------------------------
# 目的：把「月开销」从拍脑袋的数字，换成一份可追溯的逐项预算。
#
#       FIRE 目标 = 月开销 × 12 ÷ 提取率
#
# 所以这里每一项金额都会直接改变 FIRE 目标、进而改变完成度。
# 改一项，全盘重算——这正是把它写进 config 而不是写进文档的原因。
#
# 口径：
#   1. 只统计「FIRE 之后」的经常性支出，不是当前的生活成本。
#   2. 一次性支出（搬家、押金、家具）不进月开销。它们不产生永续
#      现金流，混进「月开销 × 12 ÷ 提取率」会同时虚增月开销与目标，
#      所以单列在 one_off，另外加总。
#   3. 逐项都标注依据；凡估算值一律写明「估算」。
#
# 切换方案：改 life_plan.profile 一行即可，其余自动重算。
# 若 profile 写了不存在的名字，程序会直接报错，不会静默回落——
# 静默回落会让 FIRE 目标悄悄跑偏，比报错危险得多。
# ------------------------------------------------------------
# 两段式时间线（2026-10-27 建立）
# ------------------------------------------------------------
# 这一段**不参与 FIRE 目标计算**，只记录「什么时候出发、能撑多久」。
# 完整推演见 docs/FIRE-ROADMAP.md。
#
# 为什么要单独记：FIRE 目标 ¥205,953.49 是「永续」口径的数字，
# 而实际计划是两段式的——阶段 A（牡丹江独立期）有明确的退出条件
# （长辈病情加重 → 回北京，此后不再回来），因此**不需要永续**。
# 两者回答的是不同问题：
#   目标公式      → 「还要攒多少」（进度条用）
#   这一段        → 「这笔钱够撑多久」（决策用）
#
# ⚠️ 改这里不会改变 README 上的 FIRE 目标与完成度。
timeline:
  # 毕业时间。既是积累期的终点，也是阶段 A 的起点。
  graduation: "2029-06"
  start_age: 22

  # 每月新投入 = 比特币 9.9 USDT/天 + 标普500 ¥20/天，按 ¥6.68/USD 折算 ≈ ¥2,584。
  # 与 contribution 段同源：改那边的定投额，记得同步这里（汇率变动会小幅影响，这里固定为规划假设）。
  # 32 个月 × ¥2,584，配合起点资产与收益，毕业时约 ¥11 万。
  # ⚠️ 在 32 个月这个尺度上，收益率仍然不重要：4.3% 与 7% 只差约 ¥4,600，
  #    而每月多存 ¥500 就能多 ¥16,000。效率来自储蓄率。
  monthly_contribution: 2584

  # 阶段 A 的退出条件。所以它的长度**不由自己决定**，由长辈健康决定。
  # 敏感性见 docs/FIRE-ROADMAP.md §3.2：外公约 95 岁是分界线——
  # 95 岁前需要照顾，3 天方案就够（18.1 年）；超过，必须 4 天。
  phase_a_exit: "长辈病情加重，需回京看护"

  # 一次性搬家支出，与 life_plan 的 one_off 同源，这里只作交叉引用。
  one_off_reference: 15000

# ------------------------------------------------------------
# 出发门槛（2026-10-31 新增）
# ------------------------------------------------------------
# 全职方案下，FIRE 目标不再是出发条件——有工作就有现金流。
# 真正决定「能不能走」的是：到了牡丹江撑得住，且不会因病返贫。
#
#     出发门槛 = 医疗专项应急金 + 一次性搬家 + 空窗期月开销
#
# ⚠️ 医疗应急金（规划书 §5.4）一直是**独立于 FIRE 目标**的一笔钱，
#    以前只写在文档里；现在第一次进入配置——因为在新方案下，
#    它才是真正的出发约束，比 ¥205,953 更早成为瓶颈。
#
# ⚠️ 一次性搬家取自 life_plan.one_off_total，这里不重复填，避免两处不一致。
#
# ⚠️ 下沿与上沿的分工：
#    下沿 = 出发前必须到位的钱（医疗 ¥5 万 + 空窗 3 个月）
#    上沿 = 加上「更保守的医疗额度 + 更长空窗」之后的需求
#    中间差额可以边工作边补——全职有现金流，这是新方案比旧方案多出来的路。
departure:
  enabled: true
  # 零医保、住院 100% 自付，取规划书 §5.4 的区间（不因取消医保而下调）
  medical_reserve_low: 50000
  medical_reserve_high: 100000
  # 到牡丹江后到第一笔工资之间，按几个月的月开销准备
  gap_months_low: 3
  gap_months_high: 6
  note: "双线进度条的第一条。它回答「能不能走」，¥205,953 回答「能不能不工作」。"

# ------------------------------------------------------------
# 资产配置（2026-10-27 新增，仅用于展示失衡程度）
# ------------------------------------------------------------
# ⚠️ **加资产不能让目标变化**——分子是比特币 + 标普500 + 纳指100 三项，
#    纳入标准是「长期不动用」。这一段只读取实时市值算占比，不改目标。
#
# 2026-10-27 实测：比特币约七成 / 标普500 约 4% / 纳指100 约 22%。
# 精确占比看 README 的「资产构成」表（自动生成），这里只记量级，避免每天漂。
# 纳指纳入分子后「非比特币敞口」升到约四分之一，但**纳指不算「稳」**——
# 它与标普500 相关性 0.9+，都是美股成长敞口。真正「稳」的仍只有 4% 出头，
# 离下面 sp500_target_range 的 25–30% 还差得远。
# 失衡的机械原因是场外标普500 限购每日 20 元（每月约 ¥600），
# 于是每月 ¥2,000 的边际配置被锁成 70 : 30。
# 详见 docs/FIRE-ROADMAP.md §2.3。
asset_allocation:
  enabled: true
  # 标普500 的目标占比区间。低于下限 = 「稳」的部分不足，
  # 整个组合的波动几乎完全由比特币决定；高于上限 = 过度保守。
  sp500_target_range: [0.25, 0.30]
  note: "再平衡走场内标普500 ETF，不受场外每日 20 元限购约束"

# ------------------------------------------------------------
life_plan:
  enabled: true
  profile: mudanjiang-rent-minimal # ← 改这一行即可切换方案

  # 定居城市：牡丹江（2026-10-29 确认，不再是占位城市）。
  #    这是他当前最想去的城市，但不是不可更改的承诺——仍保留调整的可能。
  #    换城市时改 city / province 与各项金额即可，其余自动重算；
  #    换城市会同时改变月开销与 FIRE 目标，须同步规划书 §2 与各文档的变更记录。
  #    与其他省内城市的对比见 docs/FIRE-LIFE-PLAN.md §2。

  profiles:
    # 当前基准方案。金额为 2026 年牡丹江口径的估算值。
    #
    # 数据依据：牡丹江市区二手房均价 ¥4,292/㎡、租售比 3.73%（聚汇数据 2026-09）；
    # 居民供热 ¥28/㎡ 按【使用面积】计收（约合建筑面积 80%）；
    # 医保 ¥400/年 与龙江惠民保 ¥150/年 为黑龙江省统一标准。
    #
    # 2026-09-27 按「省钱项逐项确认」下调了 6 项（面积、食品、日用品/衣物/娱乐、
    # 家电二手、网络手机、市内交通），并保留全部安全垫（应急缓冲、医疗自付、惠民保）。
    mudanjiang-rent-minimal:
      city: 牡丹江
      province: 黑龙江
      housing: rent
      household: 1
      lifestyle: 极简
      headline: 牡丹江 · 单人 · 租房 · 极简
      items:
        - {key: rent, group: 住房与水电燃气, label: 房租, monthly: 500, note: "40㎡ 一居室。房天下 2026-10 实际挂牌：一居室区间 ¥400-850（爱民吉祥花园 50㎡ ¥400、龙门鑫家园 57㎡ ¥450 为低位）。原按均价×租售比推得 ¥534，2026-10-08 结合真实房源取 ¥500。⚠️ 2026-10-29 复核：四个区 ¥450-550 档都能租到 50㎡ 以上，¥500 是偏保守的取值，保留作为安全垫；区级选址见 docs/FIRE-LIFE-PLAN.md §2.5（爱民区）"}
        - {key: heating, group: 住房与水电燃气, label: 取暖费, monthly: 75, note: "居民供热 ¥28/㎡ 按【使用面积】计收（约合建筑面积 80%）。40㎡ × 80% × ¥28 ÷ 12 ≈ ¥75。⚠️ 2026-10-08 查证：是否含在租金内【因房源而异】（房天下把「房租包含取暖费吗」做成逐套问答字段），无「大部分包」的证据；且即使房东包，成本通常已折算进租金。故按租客自付保守建模——看房时务必逐套问清并写进合同"}
        - {key: property_fee, group: 住房与水电燃气, label: 物业费, monthly: 15, note: "¥0.375/㎡·月 × 40㎡。牡丹江物业费实行政府指导价并按服务分级，有电梯与无电梯差约一倍；原按 ¥0.6/㎡（≈二级无电梯）建模，2026-10-08 下调到三级无电梯档。⚠️ 与取暖费同理：房天下把「房租包含物业费吗」做成逐套问答字段，即使房东交也可能折算进租金——看房时逐套问清并写进合同"}
        - {key: water, group: 住房与水电燃气, label: 水费, monthly: 12, note: "单人约 3 吨/月"}
        - {key: electricity, group: 住房与水电燃气, label: 电费, monthly: 55, note: "约 110 度/月。冬季靠集中供暖，不需要电暖器，用电量低于南方。峰谷分时经评估后未采用"}
        - {key: gas, group: 住房与水电燃气, label: 燃气/液化气, monthly: 35, note: "自己做饭；牡丹江管道燃气覆盖较好，可能低于此值"}
        - {key: appliance, group: 住房与水电燃气, label: 家电维修与更换摊销, monthly: 20, note: "改买二手（约 ¥200-300）。按 10 年摊销，无保修"}
        - {key: telecom, group: 日常开销, label: 网络与手机, monthly: 30, note: "纯流量卡约 ¥29/月，不装宽带（用手机热点）。代价：依赖手机信号，大流量受限"}
        - {key: food, group: 日常开销, label: 食品, monthly: 300, note: "偏紧档 ¥300，实付约 ¥284（余 ¥16）。⚠️ 2026-10-26 改为【线上为主】：16:8 两餐、不炒菜、全部一锅煮。面包 ¥0.40/包、牛奶 ¥0.625/袋、挂面 ¥0（券价，均约零售价 20%）；生鲜走多多买菜。购物篮：面包 60 包 + 牛奶 60 袋 + 挂面 6kg + 鸡蛋 120 个 + 北豆腐 4.5kg + 西红柿 4.5kg + 韭菜 3.6kg + 大白菜 6kg + 橙子 6kg。逐项清单与营养评估见规划书 §4.2–4.3，品类汇总见 §6.5。⚠️ 券价部分脆弱：面包/奶/挂面回到零售价，食品会跳到约 ¥400"}
        - {key: drinking_water, group: 日常开销, label: 饮用水, monthly: 15, note: "桶装水或净水器滤芯；自来水费已单列在水费里"}
